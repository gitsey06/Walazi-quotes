<!DOCTYPE html>
<html>
<head>
  <title>Walazi Quotes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; padding: 20px; background: #f4f4f4; }
    .card { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; }
    button { width: 100%; padding: 15px; margin: 8px 0; background: #25D366; color: white; border: none; border-radius: 8px; font-size: 16px; }
    select { width: 100%; padding: 12px; margin: 8px 0; }
    h2 { color: #128C7E; }
  </style>
</head>
<body>
<div id="details" style="background:#e8f5e9; padding:10px; border-radius:8px; margin:10px 0; font-size:14px;">
  <b id="packageTitle">Basic MK 120,000 includes:</b><br>
  <span id="packageDetails">
    ✅ 5 Pages + Contact Form<br>
    ✅ WhatsApp Button<br>
    ✅ Mobile Friendly<br>
    ✅ Free.com domain 1 year
  </span>
</div>

<script>
  const packageInfo = {
    "120000": {
      title: "Basic MK 120,000 includes:",
      details: "✅ 5 Pages + Contact Form<br>✅ WhatsApp Button<br>✅ Mobile Friendly<br>✅ Free.com domain 1 year"
    },
    "250000": {
      title: "Standard MK 250,000 includes:",
      details: "✅ Everything in Basic<br>✅ 10 Pages + Blog<br>✅ Google Maps + SEO Setup<br>✅ 3 Months Support"
    },
    "450000": {
      title: "Premium MK 450,000 includes:",
      details: "✅ Everything in Standard<br>✅ Online Store / Booking System<br>✅ Payment Gateway: Airtel Money<br>✅ 6 Months Support + Training"
    }
  };

  document.getElementById('package').addEventListener('change', updateDetails);
  
  function updateDetails() {
    let price = document.getElementById('package').value;
    document.getElementById('packageTitle').innerHTML = packageInfo[price].title;
    document.getElementById('packageDetails').innerHTML = packageInfo[price].details;
  }

  function getQuote() {
    let service = document.getElementById('service').value;
    let price = document.getElementById('package').value;
    let packageName = document.getElementById('package').options[document.getElementById('package').selectedIndex].text;
    let msg = `Hi Walazi. I want ${service}. Package: ${packageName}`;
    window.open(`https://wa.me/265993262353?text=${encodeURIComponent(msg)}`, '_blank');
  }
  
  // Run once on load
  updateDetails();
</script>


</body>
</html>
